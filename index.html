    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; width: 100%; min-height: 100%; min-height: 100dvh; background: #f8f6ef; }
      html { font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; overflow-x: hidden; color: #0b3425; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      button, input, select, textarea { font: inherit; }
      svg, img { max-width: 100%; }
      .hydra-root, .phone-app { min-height: 100%; background: #f8f6ef; }
      .screen { width: 100%; padding: 24px 20px 112px; }
      .home-screen { padding-top: 0; }
      .home-brandbar { display: flex; align-items: center; justify-content: space-between; min-height: 88px; padding-top: max(18px, env(safe-area-inset-top)); }
      .wordmark { display: inline-flex; align-items: center; gap: 10px; }
      .wordmark-mark { width: 52px; height: 52px; flex: 0 0 52px; display: block; }
      .wordmark-copy { display: flex; flex-direction: column; line-height: .9; }
      .wordmark-copy span, .wordmark-copy strong { font-size: 21px; font-weight: 800; letter-spacing: -.04em; }
      .wordmark-copy span { color: #174c36; }
      .wordmark-copy strong { color: #f49a31; }
    </style>

    <style id="hydra-static-launch-style">
      html.hydra-launch-active,
      html.hydra-launch-active body {
        overflow: hidden !important;
        overscroll-behavior: none;
      }

      .hydra-launch {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        overflow: hidden;
        isolation: isolate;
        margin: 0;
        padding: 0;
        border: 0;
        background: #0d4d34;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        will-change: opacity;
      }

      .hydra-launch__center {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .hydra-launch__mark {
        display: block;
        width: clamp(160px, 46vw, 192px);
        max-width: none;
        height: auto;
        aspect-ratio: 1;
        object-fit: contain;
        opacity: 0;
        transform: scale(.86);
        transform-origin: 50% 50%;
        -webkit-mask-image: radial-gradient(ellipse closest-side, #000 88%, transparent 100%);
        mask-image: radial-gradient(ellipse closest-side, #000 88%, transparent 100%);
        will-change: transform, opacity;
      }

      .hydra-launch[data-phase="entering"] .hydra-launch__mark {
        animation: hydra-launch-arrive 620ms cubic-bezier(.16, 1, .3, 1) both;
      }

      .hydra-launch[data-phase="exiting"] {
        animation: hydra-launch-dismiss 700ms linear both;
      }

      .hydra-launch[data-phase="exiting"] .hydra-launch__mark {
        animation: hydra-launch-zoom 700ms cubic-bezier(.64, 0, .8, .25) both;
      }

      @keyframes hydra-launch-arrive {
        from { opacity: 0; transform: scale(.86); filter: blur(6px); }
        to { opacity: 1; transform: scale(1); filter: blur(0); }
      }

      @keyframes hydra-launch-zoom {
        0% { opacity: 1; transform: scale(1); filter: blur(0); }
        72% { opacity: 1; }
        100% { opacity: 0; transform: scale(9); filter: blur(7px); }
      }

      @keyframes hydra-launch-dismiss {
        0%, 45% { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .hydra-launch[data-phase] .hydra-launch__mark {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
        .hydra-launch[data-phase="exiting"] {
          animation: hydra-launch-dismiss 160ms linear both;
        }
      }

      /* A splash real fica fora do React. A antiga não pode cobrir nem alterar a nova. */
      #root .hydra-launch { display: none !important; }
      #root .splash-screen {
        display: contents !important;
        position: static !important;
        inset: auto !important;
        width: auto !important;
        height: auto !important;
        min-width: 0 !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        pointer-events: none !important;
      }
    </style>

    <style id="hydra-final-mobile-overrides">
      @media (max-width: 899px) {
        html,
        body,
        #root {
          min-height: 100dvh !important;
          background: #f8f6ef !important;
          background-color: #f8f6ef !important;
          background-image: none !important;
        }

        html body #root .hydra-root.theme-light,
        html body #root .hydra-root.theme-light .app-shell,
        html body #root .hydra-root.theme-light .phone-app,
        html body #root .hydra-root.theme-light .phone-app .app-content {
          min-height: 100dvh !important;
          background: #f8f6ef !important;
          background-color: #f8f6ef !important;
          background-image: none !important;
        }

        html body #root .hydra-root .phone-app .app-content > .screen:not(.profile-screen) {
          min-height: 0 !important;
          height: auto !important;
        }

        html body #root .hydra-root .phone-app .app-content > .home-screen {
          min-height: 0 !important;
          height: auto !important;
          padding-bottom: calc(112px + env(safe-area-inset-bottom)) !important;
        }

        html body #root .hydra-root.theme-light .phone-app .app-content:has(> .profile-screen),
        html body #root .hydra-root.theme-light .phone-app .app-content > .profile-screen {
          background: #f8f6ef !important;
          background-color: #f8f6ef !important;
          background-image: none !important;
        }

        html body #root .hydra-root.theme-dark,
        html body #root .hydra-root.theme-dark .app-shell,
        html body #root .hydra-root.theme-dark .phone-app,
        html body #root .hydra-root.theme-dark .phone-app .app-content,
        html body #root .hydra-root.theme-dark .phone-app .app-content > .screen {
          background-color: #08261c !important;
          background-image: none !important;
        }

        html body #root .hydra-root .app-shell,
        html body #root .hydra-root .phone-app,
        html body #root .hydra-root .phone-app .app-content,
        html body #root .hydra-root .phone-app .app-content > .screen,
        html body #root .hydra-root .phone-app .app-content > .profile-screen {
          border: 0 !important;
          border-top: 0 !important;
          border-bottom: 0 !important;
          outline: 0 !important;
          box-shadow: none !important;
          filter: none !important;
        }

        html body #root .hydra-root .app-shell::before,
        html body #root .hydra-root .app-shell::after,
        html body #root .hydra-root .phone-app::before,
        html body #root .hydra-root .phone-app::after,
        html body #root .hydra-root .phone-app .app-content::before,
        html body #root .hydra-root .phone-app .app-content::after,
        html body #root .hydra-root .phone-app .app-content > .screen::before,
        html body #root .hydra-root .phone-app .app-content > .screen::after {
          content: none !important;
          display: none !important;
          border: 0 !important;
          outline: 0 !important;
          box-shadow: none !important;
          background: transparent !important;
        }

        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav .touch-ripple {
          display: none !important;
          animation: none !important;
        }
      }

      html.hydra-splash-active,
      html.hydra-splash-active body,
      html.hydra-splash-active body #root {
        background: #09271b !important;
        background-color: #09271b !important;
        background-image: none !important;
        overflow: hidden !important;
      }

      html.hydra-splash-active body .app-shell,
      html.hydra-splash-active body .bottom-nav {
        display: none !important;
        pointer-events: none !important;
      }

      html.hydra-splash-active body .splash-screen {
        position: fixed !important;
        z-index: 2147483647 !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        min-width: 100vw !important;
        min-height: 100dvh !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: #09271b !important;
        background-color: #09271b !important;
        background-image: none !important;
        overflow: hidden !important;
        pointer-events: all !important;
        touch-action: none !important;
        transform: none !important;
      }

      /* O lock legado não manda mais na splash nova. */
      html.hydra-splash-active:not(.hydra-launch-active) body .app-shell { display: block !important; pointer-events: auto !important; }
      html.hydra-splash-active:not(.hydra-launch-active) body .bottom-nav { display: flex !important; pointer-events: auto !important; }
      html.hydra-splash-active:not(.hydra-launch-active) body #root .splash-screen { display: contents !important; background: transparent !important; pointer-events: none !important; }
    </style>
