<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f3727" />
    <meta name="description" content="Hydra Agro — tecnologia rural para rebanho, equipe e operações da propriedade." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://hydraagro.sbs/" />
    <link rel="icon" href="/hydra-mark.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Hydra Agro" />
    <meta property="og:title" content="Hydra Agro" />
    <meta property="og:description" content="Tecnologia rural para rebanho, equipe e operações da propriedade." />
    <meta property="og:url" content="https://hydraagro.sbs/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hydra Agro" />
    <meta name="twitter:description" content="Tecnologia rural para rebanho, equipe e operações da propriedade." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Hydra Agro",
        "url": "https://hydraagro.sbs/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android",
        "description": "Tecnologia rural para rebanho, equipe e operações da propriedade."
      }
    </script>

    <!-- Base crítica: evita flash de HTML cru enquanto o CSS principal termina de carregar. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; min-height: 100%; }
      html { background: #f8f6ef; font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; overflow-x: hidden; background: #f8f6ef; color: #0b3425; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      button, input, select, textarea { font: inherit; }
      svg, img { max-width: 100%; }
      .hydra-root, .phone-app { min-height: 100%; background: #f8f6ef; }
      .screen { width: 100%; padding: 24px 20px 112px; }
      .home-screen { padding-top: 0; }
      .home-brandbar { display: flex; align-items: center; justify-content: space-between; min-height: 88px; padding-top: max(18px, env(safe-area-inset-top)); }
      .wordmark { display: inline-flex; align-items: center; gap: 10px; }
      .wordmark-mark { width: 52px; height: 52px; flex: 0 0 52px; display: block; }
      .wordmark-copy { display: flex; flex-direction: column; line-height: .9; }
      .wordmark-copy span, .wordmark-copy strong { font-size: 21px; font-weight: 800; letter-spacing: -.04em; }
      .wordmark-copy span { color: #174c36; }
      .wordmark-copy strong { color: #f49a31; }
    </style>

    <!-- Entrada única. O Vite agrupa os imports no build e evita CSS chegando fora de ordem. -->
    <link rel="stylesheet" href="/src/app-entry.css?v=app-entry-6" />

    <title>Hydra Agro</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Registra o retorno OAuth do Android antes do React montar. -->
    <script type="module" src="/src/runtime-bootstrap.ts"></script>
    <!-- Valida existência do e-mail antes do React avançar no login/cadastro. -->
    <script type="module" src="/src/auth-validation.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/herd-tabs.ts"></script>
    <script type="module" src="/src/pull-to-refresh.ts?v=pull-refresh-1"></script>

    <!-- Overrides finais ficam no fim do documento para vencer CSS carregado pelo main.tsx. -->
    <style id="hydra-final-mobile-overrides">
      @media (max-width: 899px) {
        /* Remove a linha preta que aparecia no fim do conteúdo, antes da bottom bar. */
        html body #root .hydra-root .app-shell,
        html body #root .hydra-root .phone-app,
        html body #root .hydra-root .phone-app .app-content,
        html body #root .hydra-root .phone-app .app-content > .screen,
        html body #root .hydra-root .phone-app .app-content > .profile-screen,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav {
          border-top: 0 !important;
          border-bottom: 0 !important;
          outline: 0 !important;
          box-shadow: none !important;
        }

        html body #root .hydra-root .app-shell::before,
        html body #root .hydra-root .app-shell::after,
        html body #root .hydra-root .phone-app::before,
        html body #root .hydra-root .phone-app::after,
        html body #root .hydra-root .phone-app .app-content::before,
        html body #root .hydra-root .phone-app .app-content::after,
        html body #root .hydra-root .phone-app .app-content > .screen::before,
        html body #root .hydra-root .phone-app .app-content > .screen::after,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav::before,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav::after {
          border: 0 !important;
          outline: 0 !important;
          box-shadow: none !important;
        }

        /* Sem slide/fade de troca de tela fora do Perfil. */
        html body #root .hydra-root .phone-app .app-content.route-motion-forward > .screen.page-enter:not(.profile-screen),
        html body #root .hydra-root .phone-app .app-content.route-motion-back > .screen.page-enter:not(.profile-screen),
        html body #root .hydra-root .phone-app .app-content > .screen.page-enter:not(.profile-screen) {
          animation: none !important;
          transition: none !important;
          transform: none !important;
          opacity: 1 !important;
          filter: none !important;
          will-change: auto !important;
        }

        /* Bottom bar totalmente estável: sem pop, jump, ripple ou compressão. */
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button > span,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button > small,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button svg {
          animation: none !important;
          transition: none !important;
        }

        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button:active,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button.is-pressed,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button.is-tapped {
          transform: none !important;
        }

        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button:not(.nav-nfc) > span:first-of-type {
          transform: none !important;
        }

        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button.nav-nfc > span:first-of-type,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button.nav-nfc:active > span:first-of-type,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button.nav-nfc.is-pressed > span:first-of-type,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav > button.nav-nfc.is-tapped > span:first-of-type {
          animation: none !important;
          transition: none !important;
          transform: translateY(-9px) !important;
        }

        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav .touch-ripple {
          display: none !important;
          animation: none !important;
        }

        /* Rebanho sem animações, como solicitado. Mantém apenas spinners de carregamento. */
        html body #root .hydra-root .herd-screen-enhanced,
        html body #root .hydra-root .herd-screen-enhanced *:not(.spin),
        html body #root .hydra-root .herd-screen-enhanced *:not(.spin)::before,
        html body #root .hydra-root .herd-screen-enhanced *:not(.spin)::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </body>
</html>
