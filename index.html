    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; min-height: 100%; }
      html { background: #f8f6ef; font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; overflow-x: hidden; background: #f8f6ef; color: #0b3425; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      button, input, select, textarea { font: inherit; }
      svg, img { max-width: 100%; }
      .hydra-root, .phone-app { min-height: 100%; background: #f8f6ef; }
      .screen { width: 100%; padding: 24px 20px 112px; }
      .home-screen { padding-top: 0; }
      .home-brandbar { display: flex; align-items: center; justify-content: space-between; min-height: 88px; padding-top: max(18px, env(safe-area-inset-top)); }
      .wordmark { display: inline-flex; align-items: center; gap: 10px; }
      .wordmark-mark { width: 52px; height: 52px; flex: 0 0 52px; display: block; }
      .wordmark-copy { display: flex; flex-direction: column; line-height: .9; }
      .wordmark-copy span, .wordmark-copy strong { font-size: 21px; font-weight: 800; letter-spacing: -.04em; }
      .wordmark-copy span { color: #174c36; }
      .wordmark-copy strong { color: #f49a31; }
    </style>

    <style id="hydra-final-mobile-overrides">
      @media (max-width: 899px) {
        html,
        body,
        #root {
          min-height: 100dvh !important;
          background: #f8f6ef !important;
          background-image: none !important;
        }

        html body #root .hydra-root.theme-light,
        html body #root .hydra-root.theme-light .app-shell,
        html body #root .hydra-root.theme-light .phone-app,
        html body #root .hydra-root.theme-light .phone-app .app-content {
          min-height: 100dvh !important;
          background: #f8f6ef !important;
          background-color: #f8f6ef !important;
          background-image: none !important;
        }

        html body #root .hydra-root .phone-app .app-content > .screen:not(.profile-screen) {
          min-height: 0 !important;
          height: auto !important;
        }

        html body #root .hydra-root .phone-app .app-content > .home-screen {
          min-height: 0 !important;
          height: auto !important;
          padding-bottom: calc(92px + env(safe-area-inset-bottom)) !important;
        }

        html body #root .hydra-root.theme-light .phone-app .app-content:has(> .profile-screen),
        html body #root .hydra-root.theme-light .phone-app .app-content > .profile-screen {
          background: #f8f6ef !important;
          background-color: #f8f6ef !important;
          background-image: none !important;
        }

        html body #root .hydra-root.theme-dark,
        html body #root .hydra-root.theme-dark .app-shell,
        html body #root .hydra-root.theme-dark .phone-app,
        html body #root .hydra-root.theme-dark .phone-app .app-content,
        html body #root .hydra-root.theme-dark .phone-app .app-content > .screen {
          background-color: #09160f !important;
          background-image: none !important;
        }

        html body #root .hydra-root .app-shell,
        html body #root .hydra-root .phone-app,
        html body #root .hydra-root .phone-app .app-content,
        html body #root .hydra-root .phone-app .app-content > .screen,
        html body #root .hydra-root .phone-app .app-content > .profile-screen,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav {
          border: 0 !important;
          border-top: 0 !important;
          border-bottom: 0 !important;
          outline: 0 !important;
          box-shadow: none !important;
          filter: none !important;
        }

        html body #root .hydra-root .app-shell::before,
        html body #root .hydra-root .app-shell::after,
        html body #root .hydra-root .phone-app::before,
        html body #root .hydra-root .phone-app::after,
        html body #root .hydra-root .phone-app .app-content::before,
        html body #root .hydra-root .phone-app .app-content::after,
        html body #root .hydra-root .phone-app .app-content > .screen::before,
        html body #root .hydra-root .phone-app .app-content > .screen::after,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav::before,
        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav::after {
          content: none !important;
          display: none !important;
          border: 0 !important;
          outline: 0 !important;
          box-shadow: none !important;
          background: transparent !important;
        }

        html body #root .hydra-root .phone-app .bottom-nav.bottom-nav .touch-ripple {
          display: none !important;
          animation: none !important;
        }
      }
    </style>
