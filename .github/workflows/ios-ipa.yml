name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/setup-ios-nfc.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and iOS support
        run: npm install --no-audit --no-fund @capacitor/ios@8.5.0

      - name: Prepare full iOS app with NFC
        run: npm run ios:setup

      - name: Apply Hydra Agro native icon
        run: |
          set -euo pipefail
          ICON_SRC="public/icon-512.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f "$ICON_SRC"
          test -f "$ICONSET/Contents.json"

          python3 - <<'PY'
          import json, os, subprocess
          icon_src = 'public/icon-512.png'
          iconset = 'ios/App/App/Assets.xcassets/AppIcon.appiconset'
          with open(os.path.join(iconset, 'Contents.json'), 'r', encoding='utf-8') as f:
              data = json.load(f)
          for item in data.get('images', []):
              filename = item.get('filename')
              size = item.get('size')
              scale = item.get('scale', '1x')
              if not filename or not size:
                  continue
              points = float(size.split('x')[0])
              mult = float(scale.rstrip('x'))
              pixels = int(round(points * mult))
              out = os.path.join(iconset, filename)
              subprocess.run(['sips', '-z', str(pixels), str(pixels), icon_src, '--out', out], check=True, stdout=subprocess.DEVNULL)
          PY

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Hydra Agro" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Hydra Agro" ios/App/App/Info.plist || true

      - name: Verify web bundle copied
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "dist size: $(du -sh dist | awk '{print $1}')"
          echo "asset files: $(find dist/assets -type f | wc -l | tr -d ' ')"

      - name: Build iPhone app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package complete IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          APP_PATH="build/ios-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/public/index.html"
          test -d "$APP_PATH/public/assets"
          cp -R "$APP_PATH" build/Payload/HydraAgro.app
          cd build
          zip -qry HydraAgro-full-unsigned.ipa Payload
          shasum -a 256 HydraAgro-full-unsigned.ipa > HydraAgro-full-unsigned.ipa.sha256
          ls -lh HydraAgro-full-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HydraAgro-iOS-full-unsigned
          path: |
            build/HydraAgro-full-unsigned.ipa
            build/HydraAgro-full-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
