name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'src/**'
      - 'scripts/setup-ios-nfc.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and iOS support
        run: npm install --no-audit --no-fund @capacitor/ios@8.5.0

      - name: Prepare iOS with NFC
        run: npm run ios:setup

      - name: Build iPhone app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          APP_PATH="build/ios-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" build/Payload/HydraAgro.app
          cd build
          zip -qry HydraAgro-unsigned.ipa Payload
          shasum -a 256 HydraAgro-unsigned.ipa > HydraAgro-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HydraAgro-iOS-unsigned
          path: |
            build/HydraAgro-unsigned.ipa
            build/HydraAgro-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
