name: Gerar APK Hydra Agro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar configuração pública do backend
        shell: bash
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SECRET_SUPABASE_URL" ] && [ -n "$SECRET_SUPABASE_KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' \
              "$SECRET_SUPABASE_URL" "$SECRET_SUPABASE_KEY" > .env.production
            echo "Usando configuração do GitHub Secrets."
          else
            cp .env.example .env.production
            echo "Secrets ausentes; usando a configuração pública versionada em .env.example."
          fi

          npm run env:check

      - name: Verificar TypeScript
        run: npm run lint

      - name: Executar testes
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Guardar diagnóstico dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-agro-test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Compilar interface web
        run: npx vite build

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Conferir APK gerado
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: hydra-agro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

